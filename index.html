<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyPulse Weather</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://kit.fontawesome.com/4c5f7d9b5d.js" crossorigin="anonymous"></script>

</head>

<body>

<div class="background"></div>

<div class="container">

<div class="logo">
🌍
<h1>Aeronova </h1>
<p>Live Weather Dashboard</p>
</div>

<div class="search-box">

<input
type="text"
id="city"
placeholder="Search any city...">

<button id="searchBtn">

<i class="fas fa-search"></i>

</button>

</div>

<div class="weather-card">

<img
id="icon"
src=""
>

<h1 id="temp">--°C</h1>

<h2 id="cityName">
Search City
</h2>

<p id="description">
Weather Description
</p>

</div>

<div class="details">

<div class="card">
💧
<h3>Humidity</h3>
<p id="humidity">--%</p>
</div>

<div class="card">
🌬️
<h3>Wind</h3>
<p id="wind">-- km/h</p>
</div>

<div class="card">
🌡️
<h3>Feels Like</h3>
<p id="feels">--°C</p>
</div>

<div class="card">
👁️
<h3>Visibility</h3>
<p id="visibility">-- km</p>
</div>

<div class="card">
🌅
<h3>Sunrise</h3>
<p id="sunrise">--</p>
</div>

<div class="card">
🌇
<h3>Sunset</h3>
<p id="sunset">--</p>
</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
